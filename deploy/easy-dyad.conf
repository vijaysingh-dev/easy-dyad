resolver 8.8.8.8 ipv6=off;
lua_shared_dict app_cache 10m;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

map $host $app_id {
  ~^(?<id>[^.]+)\.(sandbox|preview)\.dev\.easy-dyad\.ai$ $id;
  default "";
}

map $host $app_mode {
  ~^.+\.sandbox\.dev\.easy-dyad\.ai$ sandbox;
  ~^.+\.preview\.dev\.easy-dyad\.ai$ preview;
  default "";
}

server {
  listen 8000;
  server_name api.dev.easy-dyad.ai *.sandbox.dev.easy-dyad.ai *.preview.dev.easy-dyad.ai;

  location / {

    set $upstream "";

    access_by_lua_block {
      local redis = require "resty.redis"
      local cache = ngx.shared.app_cache

      local appId = ngx.var.app_id
      local mode = ngx.var.app_mode

      if not appId or appId == "" then
        ngx.var.upstream = "http://127.0.0.1:8001"
        return
      end

      local cache_key = appId .. ":" .. mode
      local cached = cache:get(cache_key)

      if cached then
        ngx.var.upstream = cached
        return
      end

      local r = redis:new()
      r:set_timeout(100)

      local ok, err = r:connect("127.0.0.1", 6379)
      if not ok then
        ngx.log(ngx.ERR, "Redis connect failed: ", err)
        ngx.var.upstream = "http://127.0.0.1:8001"
        return
      end

      local key = "app:" .. appId
      local ip = r:hget(key, "ip")
      local port

      if mode == "sandbox" then
        port = r:hget(key, "sandbox")
      else
        port = r:hget(key, "preview")
      end

      if not ip or ip == ngx.null or not port or port == ngx.null then
        ngx.log(ngx.WARN, "No route for ", key)
        ngx.var.upstream = "http://127.0.0.1:8001"
        return
      end

      local target = "http://" .. ip .. ":" .. port
      cache:set(cache_key, target, 2) -- 2s micro-cache
      r:set_keepalive(10000, 100)

      ngx.var.upstream = target
    }

    proxy_pass $upstream;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 300;
    proxy_send_timeout 300;
  }
}
